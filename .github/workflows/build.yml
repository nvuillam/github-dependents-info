name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }} # zizmor: ignore[secrets-outside-env]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: make poetry-download

      - name: Set up cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev

      - name: Run style checks
        run: |
          make check-codestyle

      - name: Run safety checks
        # Safety.io throttles concurrent scans (HTTP 429) when every matrix job
        # calls it at once, so run the scan on a single Python version.
        if: ${{ env.SAFETY_API_KEY != '' && matrix.python-version == '3.12' }}
        env:
          SAFETY_API_KEY: ${{ env.SAFETY_API_KEY }}
        run: |
          make check-safety

      - name: Run tests
        run: |
          make test
